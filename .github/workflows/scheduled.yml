name: scheduled-probe

# Temporary. Observes the OIDC claims a *schedule*-triggered job receives.
# Scheduled workflows only fire from the default branch, so this must live on
# main. workflow_dispatch is included as a same-file control: a direct job, so
# workflow_ref and job_workflow_ref should be identical and differ only in the
# event that produced them.
#
# No AWS: the token is minted, decoded in-process, and a fixed claim list is
# printed. The JWT itself is never printed.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  scheduled-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken("sts.amazonaws.com");
            const c = JSON.parse(Buffer.from(t.split(".")[1], "base64").toString());
            const keep = ["iss","aud","sub","repository","repository_id","workflow",
                          "workflow_ref","job_workflow_ref","ref","event_name"];
            const rows = keep.map(k => `${k.padEnd(20)} ${c[k] === undefined ? "(ABSENT)" : c[k]}`).join("\n");
            core.info(`\n##### SCHEDULE-PROBE event=${c.event_name} #####\n${rows}\n##### END #####`);
            await core.summary.addHeading(`claims (${c.event_name})`).addCodeBlock(rows).write();
